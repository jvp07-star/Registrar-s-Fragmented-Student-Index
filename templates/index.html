<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Student Index Recovery</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #22c55e;
      --err: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    textarea {
      width: 100%;
      min-height: 96px;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.85rem;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #082f49;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .status-ok {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .status-err {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .meta-box {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }
    .meta-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .meta-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1rem;
      margin-top: 0.2rem;
    }
    pre {
      margin: 0;
      padding: 1rem;
      border-radius: 8px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registrar Student Index Recovery</h1>
    <p class="subtitle">Merge 1–3 node BST fragments into one valid student index or detect ordering/connectivity conflicts.</p>

    <div class="card">
      <label for="fragmentsInput">BST Fragments ([root, left, right], use null or None for empty child)</label>
      <textarea id="fragmentsInput">[[40, 20, 60], [20, 12, 28], [60, 50, 75], [12, 8, null], [75, null, 88]]</textarea>

      <div class="actions">
        <button id="recoverBtn" class="btn-primary" type="button">Recover Index</button>
        <button class="btn-secondary" type="button" onclick="setSample('[[2,1],[3,2,5],[5,4]]')">Illustrative Sample</button>
        <button class="btn-secondary" type="button" onclick="setSample('[[40,20,60],[20,12,28],[60,35,75]]')">Conflict Sample</button>
        <button class="btn-secondary" type="button" onclick="setSample('[[40,20,60],[20,12,28],[100,95,105]]')">Unused Fragment Sample</button>
      </div>
    </div>

    <div id="resultCard" class="card" style="display: none;">
      <div id="statusBadge" class="status-badge"></div>
      <p id="reasonText" style="margin: 0.75rem 0 0;"></p>

      <div id="treeSection" style="display: none;">
        <div class="meta-grid">
          <div class="meta-box">
            <div class="meta-label">Merged Root ID</div>
            <div id="rootVal" class="meta-value"></div>
          </div>
          <div class="meta-box">
            <div class="meta-label">Inorder Traversal</div>
            <div id="inorderVal" class="meta-value"></div>
          </div>
        </div>
        <label>Centered BST View</label>
        <pre id="treeAscii"></pre>
      </div>
    </div>
  </div>

  <script>
    function setSample(val) {
      document.getElementById("fragmentsInput").value = val;
      runRecovery();
    }

    async function runRecovery() {
      const raw = document.getElementById("fragmentsInput").value;
      const res = await fetch("/api/recover", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fragments: raw })
      });
      const data = await res.json();

      const card = document.getElementById("resultCard");
      const badge = document.getElementById("statusBadge");
      const reasonEl = document.getElementById("reasonText");
      const treeSection = document.getElementById("treeSection");

      card.style.display = "block";
      reasonEl.textContent = data.reason || "";

      if (data.possible) {
        badge.className = "status-badge status-ok";
        badge.textContent = "RECOVERED";
        treeSection.style.display = "block";
        document.getElementById("rootVal").textContent = String(data.root);
        document.getElementById("inorderVal").textContent = "[" + (data.inorder || []).join(", ") + "]";
        document.getElementById("treeAscii").textContent = data.tree_ascii || "";
      } else {
        badge.className = "status-badge status-err";
        badge.textContent = "IMPOSSIBLE";
        treeSection.style.display = "none";
      }
    }

    document.getElementById("recoverBtn").addEventListener("click", runRecovery);
    runRecovery();
  </script>
</body>
</html>
